[build-system]
requires = ["setuptools>=84.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vmt"
version = "0.1.0"
description = "Local-first transcription and speaker diarization for Apple Voice Memos"
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]

[project.optional-dependencies]
core = [
    "numpy>=2.4.6",
    "typer>=0.12",
]
ml = [
    "whisperx>=3.1",
    "pyannote.audio>=3.1",
    "torch>=2.2",
]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.5",
]

[project.scripts]
vmt = "vmt.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
